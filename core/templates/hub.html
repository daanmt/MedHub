<title>MedHub</title>
<!--
  Template do MedHub HUB (v0) -- spec .vibeflow/specs/medhub-hub-v0-part-1.md.
  Montado por `python tools/hub.py --build`; publicado SEMPRE no mesmo artifact
  (rito em .claude/commands/revisar.md, "DRENAR no player").

  Sem DOCTYPE/html/head/body: o publish embrulha este arquivo num esqueleto
  (contrato de pagina do Artifact). O titulo fica nos primeiros 8 KB.

  Lugares preenchidos pelo hub.py (cada um exatamente 1x): o CSS, o corpo e o
  JS do player (regioes de core/templates/player.html -- a fonte unica), a lista
  de aulas e o bloco do painel. (A linha de estado "montado ... lote ... cards" saiu
  na s194: era bastidor na tela do operador.) O lote entra no script de
  id "lote" pelo mesmo injetor do --build-player (marcador unico; nao repetir a
  tag aqui).

  FRONTEIRA: a pagina so escreve sessoes/<sessao>/notas (regra do db declarada no
  publish). Nunca FSRS, card ou resumo. Aulas e painel sao arquivos do MESMO
  artifact, lidos por fetch relativo e mostrados num iframe srcdoc DENTRO da aba
  -- o frame nunca navega, entao o drill nao perde estado e o db nao e tocado.
-->
<style>
/* @hub:player-css */

/* ------------------------------------------------ casca do HUB (so acrescenta) */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark}
}
:root[data-theme="dark"]{color-scheme:dark}

.hub-topo{margin-bottom:12px}
.hub-marca{margin:0;font-weight:750;font-size:1.05rem;letter-spacing:.01em}
.hub-marca span{color:var(--acento)}

.hub-abas{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;
  padding:4px;margin-bottom:24px;
  background:var(--afundado);border:1px solid var(--linha);border-radius:12px;
}
.hub-aba{
  min-height:44px;padding:8px 6px;border:0;border-radius:9px;
  background:transparent;color:var(--tinta2);font-weight:600;letter-spacing:.01em;
}
.hub-aba:hover{background:var(--card);color:var(--tinta)}
.hub-aba[aria-selected="true"]{background:var(--card);color:var(--acento);box-shadow:var(--sombra)}

.hub-secao{display:none}
:root:not([data-aba]) #aba-painel,
:root[data-aba="cards"] #aba-cards,
:root[data-aba="aulas"] #aba-aulas,
:root[data-aba="painel"] #aba-painel{display:block}

.hub-titulo{font-size:clamp(1.15rem,1rem + .7vw,1.5rem);margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
.hub-sub{color:var(--tinta3);font-size:.85em;margin:0 0 18px;max-width:40rem}
.hub-vazio{color:var(--tinta3);margin:0}

.hub-aula{
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:4px 14px;
  min-height:44px;padding:15px 16px;
  background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);
  color:var(--tinta);text-decoration:none;
  transition:border-color var(--transicao);
}
.hub-aula:hover{border-color:var(--acento)}
.hub-aula:focus-visible{outline:3px solid var(--acento);outline-offset:3px}
.hub-aula-t{min-width:0;font-weight:600;line-height:1.35}
.hub-aula-d{color:var(--tinta3);font-size:.8em;font-variant-numeric:tabular-nums}

/* Quadro de aulas (s194): colunas por tipo, empilhadas no celular; "feito" risca e recolhe */
.qd-colunas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr));gap:22px 18px;align-items:start}
.qd-col{min-width:0}
.qd-titulo{display:flex;align-items:baseline;gap:8px;margin:0 0 10px;font-size:.95rem;font-weight:650;color:var(--tinta2)}
.qd-n{font-size:.78em;font-weight:600;color:var(--tinta3);font-variant-numeric:tabular-nums}
.qd-lista{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.qd-vazio{color:var(--tinta3);font-size:.88em;margin:0;padding:12px 0}
.qd-item{min-width:0;display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center}
.qd-feito{
  width:44px;height:44px;padding:0;display:grid;place-items:center;
  border:2px solid var(--linha);border-radius:10px;background:var(--card);cursor:pointer;
}
.qd-feito span{width:12px;height:20px;margin-top:-4px;border:solid transparent;border-width:0 3px 3px 0;transform:rotate(45deg)}
.qd-feito:hover:not([disabled]){border-color:var(--acento)}
.qd-feito:hover:not([disabled]) span{border-color:var(--acento-fraco)}
.qd-feito[aria-pressed="true"]{background:var(--acento);border-color:var(--acento)}
.qd-feito[aria-pressed="true"] span{border-color:var(--papel)}
.qd-feito[disabled]{cursor:not-allowed;opacity:.5}
.qd-feito:focus-visible{outline:3px solid var(--acento);outline-offset:3px}
.qd-item[data-feito] .hub-aula{background:transparent}
.qd-item[data-feito] .hub-aula-t{text-decoration:line-through;text-decoration-thickness:2px;color:var(--tinta3)}
.qd-item.qd-chegou .hub-aula{animation:qd-chegou 700ms ease-out}
@keyframes qd-chegou{from{border-color:var(--acento);background:var(--acento-fraco)}}
@media (prefers-reduced-motion: reduce){.qd-item.qd-chegou .hub-aula{animation:none}}
.qd-feitas{margin-top:26px;border-top:1px solid var(--linha);padding-top:6px}
.qd-feitas summary{cursor:pointer;min-height:44px;padding:11px 0;font-weight:650;color:var(--tinta2)}
.qd-feitas .qd-lista{margin-top:8px}
.qd-aviso{color:var(--tinta3);font-size:.86em;margin:0 0 14px}

.hub-leitor-barra{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:14px}
.hub-leitor-titulo{margin:0;min-width:0;font-weight:650}
.hub-quadro{
  display:block;width:100%;min-height:50vh;border:0;
  background:var(--papel);border-radius:var(--raio);
}
.hub-quadro-rolavel{height:80vh}
.hub-aviso{
  border-left:3px solid var(--alerta);background:var(--alerta-fraco);color:var(--tinta);
  padding:12px 14px;border-radius:8px;margin:0 0 14px;font-size:.9em;
}
.hub-aviso a{color:var(--acento)}
</style>

<div class="wrap">

  <header class="hub-topo">
    <p class="hub-marca">Med<span>Hub</span></p>
  </header>

  <nav class="hub-abas" role="tablist" aria-label="Secoes do MedHub">
    <button type="button" class="hub-aba" role="tab" id="hub-tab-painel" aria-controls="aba-painel" aria-selected="true" data-aba="painel">Painel</button>
    <button type="button" class="hub-aba" role="tab" id="hub-tab-aulas" aria-controls="aba-aulas" aria-selected="false" data-aba="aulas" tabindex="-1">Aulas</button>
    <button type="button" class="hub-aba" role="tab" id="hub-tab-cards" aria-controls="aba-cards" aria-selected="false" data-aba="cards" tabindex="-1">Cards</button>
  </nav>

  <section class="hub-secao" id="aba-painel" role="tabpanel" aria-labelledby="hub-tab-painel">
    <!-- @hub:painel -->
  </section>

  <section class="hub-secao" id="aba-aulas" role="tabpanel" aria-labelledby="hub-tab-aulas">
    <div id="hub-aulas-lista">
      <h2 class="hub-titulo">Aulas</h2>
      <p class="hub-sub">Marque o que você já fez: vai riscado para Concluídas. A aula abre aqui dentro e os cards continuam onde você parou.</p>
      <!-- @hub:aulas -->
    </div>
    <div id="hub-leitor" hidden>
      <div class="hub-leitor-barra">
        <button type="button" id="hub-leitor-voltar">&lsaquo; Todas as aulas</button>
        <p class="hub-leitor-titulo" id="hub-leitor-titulo"></p>
      </div>
      <p class="hub-aviso" id="hub-leitor-aviso" hidden>Nao consegui abrir a aula aqui dentro. <a id="hub-leitor-link" href="#">Abrir em pagina inteira</a>.</p>
      <iframe class="hub-quadro" id="hub-leitor-quadro" title="Aula"></iframe>
    </div>
  </section>

  <section class="hub-secao" id="aba-cards" role="tabpanel" aria-labelledby="hub-tab-cards">
<!-- @hub:player-corpo -->
  </section>

</div>

<script id="lote" type="application/json">{"sessao":"exemplo","gerado_em":"","total":0,"cards":[]}</script>
<!-- @hub:player-js -->
<script>
(function(){
  "use strict";

  var ABAS = ["painel", "aulas", "cards"];
  var raiz = document.documentElement;
  var botoes = Array.prototype.slice.call(document.querySelectorAll(".hub-aba"));
  var $ = function(id){ return document.getElementById(id); };

  // ------------------------------------------------------------------ abas
  function valida(aba){ return ABAS.indexOf(aba) >= 0 ? aba : null; }
  function doHash(){ return valida(String(location.hash || "").replace(/^#/, "")); }
  function lembrada(){
    try{ return valida(localStorage.getItem("medhub.aba")); }catch(e){ return null; }
  }

  function ir(aba, gravar){
    raiz.setAttribute("data-aba", aba);
    botoes.forEach(function(b){
      var sel = b.getAttribute("data-aba") === aba;
      b.setAttribute("aria-selected", sel ? "true" : "false");
      b.tabIndex = sel ? 0 : -1;
    });
    if(gravar){
      try{ localStorage.setItem("medhub.aba", aba); }catch(e){}
    }
    if(aba === "painel"){ carregarPainel(); }
    // quadro medido com a aba escondida volta com altura 0: remede depois do reflow
    setTimeout(ajustarVisiveis, 60);
  }

  botoes.forEach(function(b, i){
    b.addEventListener("click", function(){ ir(b.getAttribute("data-aba"), true); });
    b.addEventListener("keydown", function(ev){
      var passo = ev.key === "ArrowRight" ? 1 : (ev.key === "ArrowLeft" ? -1 : 0);
      if(!passo){ return; }
      ev.preventDefault();
      var alvo = botoes[(i + passo + botoes.length) % botoes.length];
      alvo.focus();
      ir(alvo.getAttribute("data-aba"), true);
    });
  });
  window.addEventListener("hashchange", function(){
    var aba = doHash();
    if(aba){ ir(aba, false); }
  });

  // ---------------------------------------------- quadro (aula ou painel)
  // A aula-base e publicada sem DOCTYPE (o esqueleto do Artifact embrulha); no
  // srcdoc ela ganha um esqueleto equivalente, senao cairia em quirks mode.
  function documentoCompleto(html){
    if(/^\s*<!doctype/i.test(html)){ return html; }
    return "<!DOCTYPE html>\n<html lang=\"pt-BR\"><head><meta charset=\"utf-8\">" +
      "<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">" +
      "<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>" +
      "</head><body>\n" + html + "\n</body></html>";
  }

  function medir(quadro){
    if(quadro.hidden || quadro.classList.contains("hub-quadro-rolavel")){ return; }
    try{
      var doc = quadro.contentDocument;
      if(!doc || !doc.body){ throw new Error("sem documento"); }
      var alto = Math.ceil(Math.max(doc.body.scrollHeight, doc.body.getBoundingClientRect().height));
      if(alto > 0){ quadro.style.height = (alto + 2) + "px"; }
    }catch(e){
      quadro.classList.add("hub-quadro-rolavel");   // sem acesso: altura fixa, rola por dentro
    }
  }

  function ajustarVisiveis(){
    [$("hub-leitor-quadro"), $("hub-painel-quadro")].forEach(function(q){ if(q){ medir(q); } });
  }

  function preparar(quadro){
    var doc = null;
    try{ doc = quadro.contentDocument; }catch(e){ doc = null; }
    if(!doc){ quadro.classList.add("hub-quadro-rolavel"); return; }
    var tema = raiz.getAttribute("data-theme");
    if(tema){ doc.documentElement.setAttribute("data-theme", tema); }
    // Bastidor (s194): o painel avulso marca carimbo, nome do CLI e rodape de
    // fonte com data-backoffice; dentro do hub eles nao aparecem.
    if(doc.head){
      var oculto = doc.createElement("style");
      oculto.textContent = "[data-backoffice]{display:none!important}";
      doc.head.appendChild(oculto);
    }
    // Atalhos do painel (s194): "Ir para os cards" troca de aba; "abrir aula" abre o leitor.
    Array.prototype.forEach.call(doc.querySelectorAll("a[data-hub-aba], a[data-hub-aula]"), function(a){
      a.addEventListener("click", function(ev){
        ev.preventDefault();
        var aba = valida(a.getAttribute("data-hub-aba"));
        var slug = a.getAttribute("data-hub-aula");
        var alvo = slug ? document.querySelector('a.hub-aula[href="aulas/' + slug + '.html"]') : null;
        ir(aba || "aulas", true);
        window.scrollTo(0, 0);
        if(alvo){ abrirAula(alvo); }
      });
    });
    Array.prototype.forEach.call(doc.querySelectorAll("a[href]"), function(a){
      var href = a.getAttribute("href") || "";
      if(/^https?:/i.test(href)){
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener");
        return;
      }
      if(href.charAt(0) === "#" && href.length > 1){
        // ancora interna: o quadro nao rola (altura = conteudo); rola a pagina-mae
        a.addEventListener("click", function(ev){
          var alvo = doc.getElementById(decodeURIComponent(href.slice(1)));
          if(!alvo){ return; }
          ev.preventDefault();
          var topo = quadro.getBoundingClientRect().top + window.pageYOffset +
                     alvo.getBoundingClientRect().top;
          window.scrollTo(0, Math.max(0, topo - 12));
        });
      }
    });
    medir(quadro);
    [150, 600, 1500, 3000].forEach(function(ms){ setTimeout(function(){ medir(quadro); }, ms); });
    if(doc.fonts && doc.fonts.ready){ doc.fonts.ready.then(function(){ medir(quadro); }); }
  }

  function carregar(quadro, href, aviso){
    aviso.hidden = true;
    quadro.hidden = false;
    quadro.classList.remove("hub-quadro-rolavel");
    quadro.style.height = "";
    return fetch(href, {cache: "no-cache"}).then(function(r){
      if(!r.ok){ throw new Error("HTTP " + r.status); }
      return r.text();
    }).then(function(html){
      quadro.onload = function(){ preparar(quadro); };
      quadro.srcdoc = documentoCompleto(html);
    }).catch(function(){
      quadro.hidden = true;
      aviso.hidden = false;
    });
  }

  var redimensionar = null;
  window.addEventListener("resize", function(){
    clearTimeout(redimensionar);
    redimensionar = setTimeout(ajustarVisiveis, 200);
  });

  // ----------------------------------------------------------------- aulas
  var lista = $("hub-aulas-lista");
  var leitor = $("hub-leitor");

  function abrirAula(link){
    var href = link.getAttribute("href");
    $("hub-leitor-titulo").textContent = link.getAttribute("data-titulo") || "";
    $("hub-leitor-link").setAttribute("href", href);
    lista.hidden = true;
    leitor.hidden = false;
    window.scrollTo(0, 0);
    carregar($("hub-leitor-quadro"), href, $("hub-leitor-aviso"));
  }

  function fecharAula(){
    var quadro = $("hub-leitor-quadro");
    quadro.onload = null;
    quadro.removeAttribute("srcdoc");
    leitor.hidden = true;
    lista.hidden = false;
  }

  Array.prototype.forEach.call(document.querySelectorAll("a.hub-aula"), function(a){
    a.addEventListener("click", function(ev){
      ev.preventDefault();
      abrirAula(a);
    });
  });
  $("hub-leitor-voltar").addEventListener("click", fecharAula);

  // --------------------------------------------------------------- quadro
  // O estado "feito" mora no db, em quadro/<slug> = {feito, ts} (regra de escrita "quadro" na
  // declaracao do publish). Sem db, o controle fica desabilitado com uma frase curta.
  var qd = $("hub-quadro");
  if(qd){ iniciarQuadro(); }

  function iniciarQuadro(){
    var itens = Array.prototype.slice.call(qd.querySelectorAll(".qd-item"));
    var feitas = qd.querySelector("#hub-quadro-feitas .qd-lista");
    var colecao = null;

    function recontar(){
      Array.prototype.forEach.call(qd.querySelectorAll(".qd-col"), function(col){
        var n = col.querySelectorAll(".qd-item").length;
        col.querySelector(".qd-n").textContent = String(n);
        col.querySelector(".qd-vazio").hidden = n > 0;
      });
      $("hub-quadro-nfeitas").textContent = String(feitas.querySelectorAll(".qd-item").length);
    }

    function inserirEmOrdem(lista, li){
      var ordem = Number(li.getAttribute("data-ordem"));
      var depois = null;
      Array.prototype.some.call(lista.children, function(outro){
        if(outro !== li && Number(outro.getAttribute("data-ordem")) > ordem){ depois = outro; return true; }
        return false;
      });
      lista.insertBefore(li, depois);
    }

    function aplicar(li, feito){
      var titulo = li.getAttribute("data-titulo") || "";
      var botao = li.querySelector(".qd-feito");
      var rotulo = feito ? "Desmarcar " + titulo : "Marcar " + titulo + " como feita";
      if(feito){ li.setAttribute("data-feito", "1"); } else { li.removeAttribute("data-feito"); }
      botao.setAttribute("aria-pressed", feito ? "true" : "false");
      botao.setAttribute("aria-label", rotulo);
      botao.setAttribute("title", rotulo);
      var destino = feito ? feitas
        : qd.querySelector('.qd-col[data-tipo="' + li.getAttribute("data-tipo") + '"] .qd-lista');
      if(destino && li.parentNode !== destino){
        inserirEmOrdem(destino, li);
        li.classList.remove("qd-chegou");
        void li.offsetWidth;
        li.classList.add("qd-chegou");
      }
      recontar();
    }

    function semArmazenamento(){
      colecao = null;
      $("hub-quadro-aviso").hidden = false;
      itens.forEach(function(li){ li.querySelector(".qd-feito").disabled = true; });
    }

    itens.forEach(function(li){
      li.querySelector(".qd-feito").addEventListener("click", function(){
        if(!colecao){ return; }
        var novo = !li.hasAttribute("data-feito");
        aplicar(li, novo);
        colecao.doc(li.getAttribute("data-slug"))
          .set({feito: novo, ts: new Date().toISOString()})
          .catch(function(){
            aplicar(li, !novo);
            $("hub-quadro-aviso").textContent = "Não consegui salvar agora. Tente de novo.";
            $("hub-quadro-aviso").hidden = false;
          });
      });
    });

    try{
      window.claude.use("db").then(function(db){
        if(!db){ semArmazenamento(); return; }
        colecao = db.collection("quadro");
        itens.forEach(function(li){ li.querySelector(".qd-feito").disabled = false; });
        colecao.onSnapshot(function(snap){
          var feito = {};
          (snap.docs || []).forEach(function(d){
            var dado = d.data && d.data();
            feito[d.id] = !!(dado && dado.feito);
          });
          itens.forEach(function(li){
            var f = !!feito[li.getAttribute("data-slug")];
            if(f !== li.hasAttribute("data-feito")){ aplicar(li, f); }
          });
        }, function(){ /* sem assinatura: vale o estado do build e o que for clicado */ });
      }).catch(semArmazenamento);
    }catch(e){
      semArmazenamento();
    }
  }

  // ---------------------------------------------------------------- painel
  var painelCarregado = false;
  function carregarPainel(){
    var quadro = $("hub-painel-quadro");
    if(painelCarregado || !quadro){ return; }
    painelCarregado = true;
    carregar(quadro, quadro.getAttribute("data-src"), $("hub-painel-aviso"));
  }

  // Padrao = Painel (s194); hash e aba lembrada continuam vencendo.
  ir(doHash() || lembrada() || "painel", false);
})();
</script>
