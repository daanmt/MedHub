  // s229 (pedido dele, 15/10: "a flag 'nova' some depois que a aula e aberta"): o que ele ABRIU fica visto POR
  // APARELHO (localStorage["medhub.vistos"] = {slug: 1}; sem armazenamento, so na memoria da pagina). A RD e a
  // analise nao vistas e nao feitas levam "nova"; abrir no leitor a tira (todas as copias) e reconta.
  var VISTOS_CHAVE = "medhub.vistos", VISTOS_MEM = {};
  function vistosLer(){
    var v = {};
    try{ var x = JSON.parse(localStorage.getItem(VISTOS_CHAVE) || "null"); if(x && typeof x === "object" && !Array.isArray(x)){ v = x; } }catch(e){}
    Object.keys(VISTOS_MEM).forEach(function(k){ v[k] = 1; });
    return v;
  }
  function visto(slug){ return !!(slug && vistosLer()[slug]); }
  var quadroVisto = function(){};
  function vistoMarcar(slug){
    if(!slug){ return; }
    VISTOS_MEM[slug] = 1;
    try{ var v = vistosLer(); v[slug] = 1; localStorage.setItem(VISTOS_CHAVE, JSON.stringify(v)); }catch(e){}
    try{ quadroVisto(slug); }catch(e){}
  }
  // s226 (part-1): a assinatura resiliente do quadro; reabrir a Teoria com ela morta (ou o botao do aviso) reassina
  var quadroLeitura = null, quadroRetentar = function(){};
  if(qd){ iniciarQuadro(); try{ secoesQuadro(qd); }catch(e){} }
  if($("hub-quadro-aviso")){ $("hub-quadro-aviso").addEventListener("click", function(e){
    if(e.target.closest && e.target.closest("[data-retentar]")){ quadroRetentar(); } }); }

  function iniciarQuadro(){
    // os itens com a chave do quadro (data-slug): a aula que cumpre uma tarefa de aula, a avulsa, a RD
    var itens = Array.prototype.slice.call(qd.querySelectorAll(".qd-item[data-slug]"));
    // s217 (P17, pedido do operador em 06/10): a Biblioteca guarda os itens em grupos por grande area; a
    // ordem e os rotulos vem do build (`data-areas`, um dono so: o hub.py)
    var areas = qd.querySelector("#hub-quadro-feitas .qd-areas");
    var ORDEM = [];
    try{ ORDEM = JSON.parse(areas.getAttribute("data-areas") || "[]"); }catch(e){ ORDEM = []; }
    var colecao = null;
    var DISC_FIM = (areas && areas.getAttribute("data-disc-fim")) || "Outros";

    function areaPos(chave){
      for(var i = 0; i < ORDEM.length; i++){ if(ORDEM[i][0] === chave){ return i; } }
      return ORDEM.length;
    }
    // o grupo do item: o `data-area` dele; fora da ordem (ou sem), o "Sem area" -- o build ja acusou
    function areaDe(li){
      var a = li.getAttribute("data-area") || "";
      return areaPos(a) < ORDEM.length ? a : "SEM";
    }
    function filho(pai, classe, attr, valor){
      return Array.prototype.filter.call(pai.children, function(o){ return o.classList.contains(classe) && o.getAttribute(attr) === valor; })[0] || null;
    }
    function novoEl(tag, classe, texto){ var e = document.createElement(tag); e.className = classe; if(texto != null){ e.textContent = texto; } return e; }
    function contadorEl(){ var n = novoEl("span", "qd-n", "0"); n.setAttribute("data-n", ""); return n; }
    // s218: a lista da DISCIPLINA do item dentro da grande area dele; a area (<details>, na posicao da ordem,
    // recolhida) e a disciplina (A-Z, "Outros" no fim) que ainda nao existem nascem aqui
    function discLista(li){
      var chave = areaDe(li), disc = li.getAttribute("data-disc") || DISC_FIM;
      var g = filho(areas, "qd-area", "data-area", chave);
      if(!g){
        g = novoEl("details", "qd-area"); g.setAttribute("data-area", chave);
        var sm = novoEl("summary", "qd-area-tit"), seta = novoEl("span", "qd-seta"), nv = novoEl("span", "qd-novas");
        seta.setAttribute("aria-hidden", "true"); nv.setAttribute("data-novas", ""); nv.hidden = true;
        sm.appendChild(seta); sm.appendChild(novoEl("span", "qd-area-rot", (ORDEM[areaPos(chave)] || [chave, chave])[1] + " "));
        sm.appendChild(contadorEl()); sm.appendChild(nv);
        g.appendChild(sm); g.appendChild(novoEl("div", "qd-area-corpo"));
        var depois = null;
        Array.prototype.some.call(areas.children, function(o){
          if(areaPos(o.getAttribute("data-area")) > areaPos(chave)){ depois = o; return true; }
          return false;
        });
        areas.insertBefore(g, depois);
        try{ areaLigar(g); }catch(e){}   // falha no controle nunca impede o movimento
      }
      var corpo = g.querySelector(".qd-area-corpo"), d = filho(corpo, "qd-disc", "data-disc", disc);
      if(!d){
        d = novoEl("div", "qd-disc"); d.setAttribute("data-disc", disc);
        var t = novoEl("h4", "qd-disc-tit", disc + " ");
        t.appendChild(contadorEl()); d.appendChild(t); d.appendChild(novoEl("ul", "qd-lista"));
        var antes = null;
        Array.prototype.some.call(corpo.children, function(o){
          var od = o.getAttribute("data-disc") || "";
          if(disc !== DISC_FIM && (od === DISC_FIM || od.localeCompare(disc, "pt", {sensitivity: "base"}) > 0)){ antes = o; return true; }
          return false;
        });
        corpo.insertBefore(d, antes);
      }
      return d.querySelector(".qd-lista");
    }
    // a identidade do item na contagem: a RD de 3 disciplinas conta 1
    function chaveItem(li){ return li.getAttribute("data-slug") || (li.getAttribute("data-resumo") ? "r:" + li.getAttribute("data-resumo") : "t" + li.getAttribute("data-tarefa")); }
    function contar(raizC, filtro){
      var vistos = {}, n = 0;
      Array.prototype.forEach.call(raizC.querySelectorAll(".qd-item"), function(li){
        if(filtro && !filtro(li)){ return; }
        var k = chaveItem(li); if(!vistos[k]){ vistos[k] = 1; n++; } });
      return n;
    }
    function eNova(li){ var t = li.getAttribute("data-tipo");
      return (t === "revisao" || t === "analise") && !li.hasAttribute("data-feito") && !(typeof visto === "function" && visto(li.getAttribute("data-slug"))); }
    function pintarNovas(el, n){ if(!el){ return; } el.textContent = n ? (n === 1 ? "1 nova" : n + " novas") : ""; el.hidden = !n; }

    // Cada secao (semana, atrasadas) reconta os seus itens; a nao fixa some quando esvazia (as fixas ficam,
    // com "Nada em aberto"); a Biblioteca conta cada documento uma vez (s218: a RD de varias disciplinas
    // sai em cada uma), cada area e cada disciplina o seu, e as RDs novas -- o grupo que esvazia sai.
    function recontar(){
      Array.prototype.forEach.call(qd.querySelectorAll(".qd-sem"), function(sec){
        var n = sec.querySelectorAll(".qd-item:not([hidden])").length;
        var rot = sec.getAttribute("data-rotulo") || "item", nrot = sec.querySelector("[data-nrot]");
        sec.querySelector("[data-n]").textContent = String(n);
        if(nrot){ nrot.textContent = n === 1 ? rot : rot + "s"; }
        sec.querySelector(".qd-vazio").hidden = n > 0;
        if(!sec.hasAttribute("data-fixa")){ sec.hidden = n === 0; }
      });
      Array.prototype.forEach.call(areas.querySelectorAll(".qd-disc"), function(d){
        var n = contar(d);
        if(!n){ d.parentNode.removeChild(d); return; }
        d.querySelector("[data-n]").textContent = String(n);
      });
      Array.prototype.forEach.call(areas.querySelectorAll(".qd-area"), function(g){
        var n = contar(g);
        if(!n){ g.parentNode.removeChild(g); return; }
        g.querySelector("[data-n]").textContent = String(n);
        pintarNovas(g.querySelector("[data-novas]"), contar(g, eNova));
      });
      $("hub-quadro-nfeitas").textContent = String(contar(areas));
      pintarNovas($("hub-quadro-novas"), contar(areas, eNova));
    }

    function inserirEmOrdem(lista, li){
      var ordem = Number(li.getAttribute("data-ordem"));
      var depois = null;
      Array.prototype.some.call(lista.children, function(outro){
        if(outro !== li && Number(outro.getAttribute("data-ordem")) > ordem){ depois = outro; return true; }
        return false;
      });
      lista.insertBefore(li, depois);
    }

    // s218: a ordem dentro da disciplina -- `data-bib` 0 RD nova, 1 resumo (A-Z, nunca se move), 2 aula
    // (e a tarefa feita), 3 RD lida; na mesma classe, a mais nova primeiro (s216: sem data = topo, a lista
    // resolvida agora)
    function bibClasse(li){ var c = parseInt(li.getAttribute("data-bib"), 10); return isNaN(c) ? 2 : c; }
    function inserirNaBiblioteca(lista, li){
      var c = bibClasse(li), d = li.getAttribute("data-data") || "9999", depois = null;
      Array.prototype.some.call(lista.children, function(outro){
        if(outro === li){ return false; }
        var co = bibClasse(outro);
        if(co > c || (co === c && c !== 1 && (outro.getAttribute("data-data") || "9999") < d)){ depois = outro; return true; }
        return false;
      });
      lista.insertBefore(li, depois);
    }
    // s218: a RD nao lida leva "nova" (classe 0, topo da disciplina); lida, perde a etiqueta (classe 3)
    function etiquetaNova(li, feito){
      var tipo = li.getAttribute("data-tipo");
      if(tipo !== "revisao" && tipo !== "analise"){ return; }
      li.setAttribute("data-bib", feito ? "3" : "0");
      var meta = li.querySelector(".qd-meta"), tag = li.querySelector(".qd-nova"), viu = typeof visto === "function" && visto(li.getAttribute("data-slug"));
      if((feito || viu) && tag){ tag.parentNode.removeChild(tag); }
      if(!feito && !viu && !tag && meta){ tag = novoEl("span", "qd-nova", "nova"); meta.insertBefore(tag, meta.children[0] || null); }
    }

    function aplicar(li, feito){
      if(feito){ li.setAttribute("data-feito", "1"); } else { li.removeAttribute("data-feito"); }
      // s226 (sprint-final-uerj part-4): a copia do backlog de RDs (topo da Teoria) nao vai a lugar
      // nenhum -- assinada some, desfeita volta; a copia da Biblioteca segue a regra de sempre
      if(li.getAttribute("data-secao") === "rd"){ li.hidden = !!feito; recontar(); return; }
      etiquetaNova(li, feito);
      // s218: o que MORA na Biblioteca (a RD, a aula avulsa) fica na sua disciplina e so reordena
      var mora = li.getAttribute("data-secao") === "biblioteca" && li.parentNode;
      var destino = mora ? li.parentNode : (feito ? discLista(li)
        : qd.querySelector('.qd-sem[data-secao="' + li.getAttribute("data-secao") + '"] .qd-lista'));
      if(!destino){
        // s216 (part-3, A7): a secao de origem nao existe mais na pagina -- fica na Biblioteca e avisa
        try{ console.warn("[hub] " + (li.getAttribute("data-slug") || li.getAttribute("data-tarefa") || "item") +
                          " sem secao de origem: fica na Biblioteca, sem riscar"); }catch(e){}
      } else {
        var chegou = li.parentNode !== destino;
        ((feito || mora) ? inserirNaBiblioteca : inserirEmOrdem)(destino, li);
        if(chegou){
          li.classList.remove("qd-chegou");
          void li.offsetWidth;
          li.classList.add("qd-chegou");
        }
      }
      recontar();
    }

    // s229: o visto (por aparelho) tira o "nova" de todas as copias; na abertura, aplica o que ja foi visto
    quadroVisto = function(slug){
      var mudou = false;
      itens.forEach(function(li){ if(li.getAttribute("data-slug") !== slug){ return; }
        var tag = li.querySelector(".qd-nova"); if(tag){ tag.parentNode.removeChild(tag); mudou = true; } });
      if(mudou){ recontar(); }
    };
    (function(){ var v = typeof vistosLer === "function" ? vistosLer() : {}, mudou = false;
      itens.forEach(function(li){ var tag = li.querySelector(".qd-nova");
        if(tag && v[li.getAttribute("data-slug")]){ tag.parentNode.removeChild(tag); mudou = true; } });
      if(mudou){ try{ recontar(); }catch(e){} } })();

    // P20: sem db nao ha o que marcar (a assinatura tambem nao grava) -- e nenhum controle a desabilitar
    function semArmazenamento(){ colecao = null; }

    // s218: a RD de varias disciplinas sai uma vez em cada; o feito vale para todas as copias
    function copias(li){ var s = li.getAttribute("data-slug"); return itens.filter(function(x){ return x.getAttribute("data-slug") === s; }); }
    // grava quadro/<slug> e desfaz a tela se falhar; a promessa diz se gravou
    function gravar(li, novo){
      copias(li).forEach(function(x){ aplicar(x, novo); });
      return colecao.doc(li.getAttribute("data-slug"))
        .set({feito: novo, ts: new Date().toISOString()})
        .then(function(){ return true; }, function(){
          copias(li).forEach(function(x){ aplicar(x, !novo); });
          $("hub-quadro-aviso").textContent = "Não consegui salvar agora. Tente de novo.";
          $("hub-quadro-aviso").hidden = false;
          return false;
        });
    }

    // s214: so marca (assinar nunca desmarca) e item ja feito nao e regravado
    quadroMarcarFeito = function(slug){
      var dele = itens.filter(function(x){ return x.getAttribute("data-slug") === slug; });
      if(!colecao || !dele.length || dele.some(function(x){ return x.hasAttribute("data-feito"); })){ return Promise.resolve(false); }
      return gravar(dele[0], true);
    };

    // s214 (pedido do operador, 04/10): lista resolvida na aba Listas sai da semana na hora, com selo;
    // o plano so registra quando o backend rodar. s216 (part-2): a regra mora em `marcarListasEm`, de
    // topo -- a MESMA pinta o Painel; aqui so o movimento para a Biblioteca.
    function aplicarLista(li, r){ if(r !== li.hasAttribute("data-feito")){ aplicar(li, r); } }

    try{
      window.claude.use("db").then(function(db){
        if(!db){ semArmazenamento(); return; }
        try{ marcarListasEm(qd, db, aplicarLista); }catch(e){}
        colecao = db.collection("quadro");
        var aviso = $("hub-quadro-aviso");
        // o aviso e dividido com o "nao consegui salvar": a leitura so limpa o que ela escreveu
        function avisoLeitura(html){
          if(!aviso){ return; }
          if(html === null){ if(aviso.hasAttribute("data-leitura")){ aviso.removeAttribute("data-leitura"); aviso.hidden = true; aviso.textContent = ""; } return; }
          aviso.setAttribute("data-leitura", "1"); aviso.innerHTML = html; aviso.hidden = false;
        }
        quadroRetentar = function(){ avisoLeitura("Carregando…"); quadroLeitura.reiniciar(); };
        quadroLeitura = assinarResiliente(function(db){ return db.collection("quadro"); }, function(snap){
          avisoLeitura(null);
          var feito = {};
          (snap.docs || []).forEach(function(d){
            var dado = d.data && d.data();
            feito[d.id] = !!(dado && dado.feito);
          });
          itens.forEach(function(li){
            var f = !!feito[li.getAttribute("data-slug")];
            if(f !== li.hasAttribute("data-feito")){ aplicar(li, f); }
          });
        }, {nome: "quadro", db: db, aoEsperar: function(){ avisoLeitura("Carregando…"); },
            // s226 (audit sprint part-1): o "feito" grava na conexao nova, nunca na que morreu
            aoReconectar: function(novo){ colecao = novo.collection("quadro"); },
            // sem assinatura: vale o estado do build e o que for clicado; o botao reassina
            aoMorrer: function(){ avisoLeitura(htmlRetentar("Não consegui ler o que você já concluiu.", "quadro")); }});
      }).catch(semArmazenamento);
    }catch(e){
      semArmazenamento();
    }
  }

  // ---------------------------------------------------------------- painel

  // -------------------------------------------------------------- questoes
  // Aba Questões (s197): as listas do EMED capturadas vivem no db do hub em listas/<id> e
  // questoes/<lista>_<num> (semeadas pelo hub a partir do banco local); a pagina grava so
  // respostas/<lista>_<num> e o veredito do operador em analises/<lista>_<num>. Regras de
  // leitura fechadas ao dono: conteudo do EMED nunca fica legivel por link.
  var QZ = {db:null, listas:[], lista:null, qs:[], resp:{}, ana:{}, grifos:{}, pos:-1, letra:null, conf:null,
            t0:0, timer:null, unsubs:[], revendo:false, iniciado:false, subListas:null, subsLista:{}};
  var ROT_QZ = {pendente:"pendente", em_curso:"em curso", capturada:"pronta", resolvendo:"em curso", resolvida:"resolvida"};
  function qzEsc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function qzAgora(){ return new Date().toISOString(); }
  // s200 (pedido do operador): a linha de cima da questao mostra so banca + ano e area > subtema
  var QZ_SIGLA = [[/unicamp/i, "UNICAMP"], [/medicina do abc/i, "FMABC"], [/santo amaro/i, "HSA Guarujá"]];
  function qzBanca(s){
    // "RJ - Universidade do Estado do Rio de Janeiro - UERJ (HUPE) - 2021" -> "UERJ 2021"
    s = String(s || "").replace(/\u00a0/g, " ").replace(/\s+/g, " ").trim();
    var anos = s.match(/\b(?:19|20)\d{2}\b/g), ano = anos ? anos[anos.length - 1] : "";
    var base = ano ? s.slice(0, s.lastIndexOf(ano)) : s, sigla = "";
    var usp = base.match(/USP\s*-\s*(RP|SP)\b/);
    if(usp){ sigla = "USP-" + usp[1]; }
    QZ_SIGLA.some(function(a){ if(!sigla && a[0].test(base)){ sigla = a[1]; } return !!sigla; });
    if(!sigla){ base.split(/\s+-\s+|[(),\/]/).some(function(c){ c = c.trim();
      if(c.length >= 3 && c.length <= 10 && /^[A-ZÀ-Ú0-9][A-ZÀ-Ú0-9+\-]*( [A-ZÀ-Ú]{2,})?$/.test(c)){ sigla = c; } return !!sigla; }); }
    if(!sigla){ sigla = base.replace(/^[A-Z]{2} - /, "").replace(/[\s,\-]+$/, ""); if(sigla.length > 28){ sigla = sigla.slice(0, 27) + "…"; } }
    return (sigla + " " + ano).trim();
  }
  function qzAssunto(tags, temaLista){
    // "Pediatria ; Pediatria > Puericultura > Geral > Higiene oral" -> "Pediatria › Puericultura"
    var caminhos = String(tags || "").split(";").map(function(p){ return p.split(">").map(function(x){ return x.trim(); }).filter(Boolean); }).filter(function(p){ return p.length; });
    var c = caminhos.filter(function(p){ return p.length >= 2; })[0];
    if(!c){ c = caminhos.map(function(p){ return p[0]; }); } // captura antiga: niveis separados por ";"
    if(!c.length){ return ""; }
    // s200: o 3o nivel e o tema de fato ("Diabetes na gestacao (DMG)", "Hernias Inguinocrurais");
    // o 2o era generico demais ("Doencas associadas a gestacao"). O OBJETIVO da questao (o que ela
    // cobra) so aparece depois de responder, na solucao: antes, entregaria a pista.
    var i = Math.min(2, c.length - 1), sub = i > 0 ? c[i] : "";
    // tema igual ao da lista nao informa nada: desce um nivel
    if(sub && c[i + 1] && sub.toLowerCase() === String(temaLista || "").trim().toLowerCase()){ sub = c[i + 1]; }
    return sub ? c[0] + " › " + sub : c[0];
  }
  function qzLs(k, v){ try{ if(v === undefined){ return JSON.parse(localStorage.getItem(k) || "null"); } localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
  function qzChave(){ return "medhub.respostas." + QZ.lista; }

  // s226 (part-1): `QZ.iniciado` = a assinatura de `listas` esta viva (ou esperando a proxima tentativa);
  // morta, reabrir a aba (ou o botao) reassina -- nunca um 2o ouvinte
  function iniciarQuestoes(){
    if(QZ.iniciado){ return; }
    QZ.iniciado = true;
    if(QZ.subListas){ $("qz-listas").innerHTML = '<p class="qd-vazio">Carregando as listas…</p>'; QZ.subListas.reiniciar(); return; }
    try{
      window.claude.use("db").then(function(db){
        if(!db){ qzSemDb(); return; }
        QZ.db = db;
        // data() vem congelado: clonar antes de anexar o id (licao da s197)
        QZ.subListas = assinarResiliente(function(db){ return db.collection("listas").orderBy("seq"); }, function(s){
          QZ.listas = s.docs.map(function(d){ var x = Object.assign({}, d.data() || {}); x._id = d.id; return x; });
          qzRenderListas(); if(typeof qzAbrirPendente === "function"){ qzAbrirPendente(); }
        }, {nome: "listas", db: db, aoReconectar: function(novo){ QZ.db = novo; },
            aoEsperar: function(){ $("qz-listas").innerHTML = '<p class="qd-vazio">Carregando as listas…</p>'; },
            aoMorrer: function(){ QZ.iniciado = false;
              $("qz-listas").innerHTML = '<p class="qd-vazio">' + htmlRetentar("Não consegui ler as listas.", "listas") + '</p>'; }});
      }).catch(qzSemDb);
    }catch(e){ qzSemDb(); }
  }
  // s229: a lista da tarefa pedida pelo "Resolver" do Painel -- a 1a por `seq` ainda por resolver, senao a 1a
  // capturada (a resolvida abre na revisao); pendente/bloqueada nao abre. PURA.
  function qzListaDaTarefa(listas, tarefa){
    var da = (listas || []).filter(function(l){ return l && String(l.tarefa) === String(tarefa) && l.status !== "pendente" && l.status !== "bloqueada"; });
    return da.filter(function(l){ return l.status !== "resolvida"; })[0] || da[0] || null;
  }
  function qzAbrirPendente(){
    if(!QZ.abrirTarefa || !QZ.listas || !QZ.listas.length){ return; }
    var l = qzListaDaTarefa(QZ.listas, QZ.abrirTarefa);
    QZ.abrirTarefa = "";
    if(l){ qzAbrir(l._id); }
  }
  function qzSemDb(){
    $("qz-listas").innerHTML = '<p class="qd-vazio">As listas não estão disponíveis nesta visualização.</p>';
  }
  // s200 (pedido do operador): listas agrupadas por semana do plano, na ordem do plano (seq),

            return '<button type="button" data-k="' + i + '" data-st="' + k + '" class="' + k + (on ? " on" : "") + (pres ? " presumido" : "") + '" aria-pressed="' + on + '"' + (pres ? ' title="Sim (presumido)"' : '') + '>' + QZ_DECL[k] + '</button>'; }).join("") + '</div>' +
          (dec && el && el.chave ? '<span class="qz-chave">' + qzEsc(el.chave) + '</span>' : '') +
          (cf ? '<em>conflito: você marcou a alternativa que este elo descarta</em>' : '') + '</li>'; }).join("") + '</ol>' + (pres ? '</details>' : '');
  }
  // s211 (part-2): a analise do agente vira UMA linha sob a cadeia -- veredito curto, armadilha e cards.
  // Pedia e Comporta sairam da tela; concordo/em parte/discordo so quando a analise aponta conflito.
  function qzAgenteHtml(a){
    if(!a){ return ""; }
    var cards = Array.isArray(a.cards) ? a.cards.map(function(c){ return "#" + c; }).join(" ") : String(a.cards || "");
    var conf = Array.isArray(a.conflitos) && a.conflitos.length > 0;
    var corpo = (a.veredito_hub ? '<p>' + qzEsc(a.veredito_hub) + '</p>' : '') + (a.armadilha ? '<p class="qz-ag-arm">Armadilha: ' + qzEsc(a.armadilha) + '</p>' : '') +
      (cards ? '<p class="qz-ag-cards">Cards ' + qzEsc(cards) + '</p>' : '');
    if(!corpo && !conf){ return ""; }
    return '<p class="qz-ag-rot">Análise do hub</p>' + corpo + (conf ?
      '<div class="qz-elo" id="qz-vered">' + [["concordo", "Concordo"], ["em_parte", "Em parte"], ["discordo", "Discordo"]].map(function(v){ return '<button type="button" data-v="' + v[0] + '" class="' + (a.veredito_operador === v[0] ? "on" : "") + '">' + v[1] + '</button>'; }).join("") + '</div>' +
      '<input type="text" class="qz-linha" id="qz-vered-nota" maxlength="300" placeholder="Por quê? (opcional)" aria-label="Por quê? (opcional)" value="' + qzEsc(a.nota_operador || "") + '"><p class="qz-status" id="qz-vered-st"></p>' : '');
  }
  function qzAnalise(){
    var q = QZ.qs[QZ.pos]; var box = $("qz-analise"); if(!q){ box.hidden = true; return; }
    if(QZ.resp[q.num]){ qzSolucao(q, QZ.resp[q.num]); }
    var a = QZ.ana[q.num]; box.innerHTML = qzAgenteHtml(a); box.hidden = !box.innerHTML;
    var vered = box.querySelector("#qz-vered"); if(!vered){ return; }
    vered.addEventListener("click", function(e){ var b = e.target.closest("button[data-v]"); if(!b || !QZ.db){ return; }
      var st = box.querySelector("#qz-vered-st"); st.className = "qz-status"; st.textContent = "Gravando…";
      QZ.db.doc("analises/" + a._id).update({veredito_operador: b.getAttribute("data-v"), nota_operador: box.querySelector("#qz-vered-nota").value.trim(), veredito_em: qzAgora()})
        .then(function(){ st.className = "qz-status ok"; st.textContent = "Veredito gravado."; })
        .catch(function(err){ st.className = "qz-status ruim"; st.textContent = "Não gravou (" + ((err && err.code) || "erro") + ")."; }); });
  }
  $("qz-figs").addEventListener("click", function(e){
    var f = e.target.closest ? e.target.closest(".qz-fig") : null; if(f){ f.classList.toggle("zoom"); }
  });
  document.addEventListener("keydown", function(e){
    if(raiz.getAttribute("data-aba") !== "questoes" || $("qz-player").hidden || $("qz-questao").hidden){ return; }
    var tag = (e.target.tagName || "").toLowerCase(); if(tag === "textarea" || tag === "input" || tag === "select"){ return; }
    // s211 (part-4): a alternativa e role=radio (nao <button>): Enter e Espaco nela a acionam
    if(e.target.classList && e.target.classList.contains("qz-alt-btn") && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); e.target.click(); return; }
    var k = e.key.toUpperCase();
    if(!$("qz-antes").hidden){
      if("ABCDE".indexOf(k) >= 0 && k.length === 1){ var b = $("qz-alts").querySelector('.qz-alt[data-l="' + k + '"] .qz-alt-btn'); if(b){ b.click(); } }
      else if("12345".indexOf(k) >= 0 && k.length === 1){ var b2 = $("qz-alts").querySelectorAll(".qz-alt-btn")[parseInt(k, 10) - 1]; if(b2){ b2.click(); } }
      else if(k === "S" || k === "D" || k === "C"){ var b3 = $("qz-seg").querySelector('button[data-c="' + {S: "solida", D: "duvida", C: "chute"}[k] + '"]'); if(b3){ b3.click(); } }
      else if(e.key === "Enter" && !$("qz-responder").disabled){ e.preventDefault(); $("qz-responder").click(); }
    } else if(e.key === "Enter" && tag !== "button"){ e.preventDefault(); if(!$("qz-proxima").disabled){ $("qz-proxima").click(); } }
  });

  // Padrao = Painel (s194); hash e aba lembrada continuam vencendo.
  ir(doHash() || lembrada() || "painel", false);
})();
</script>
