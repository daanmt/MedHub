<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player de Cards</title>
<!--
  Template do player de cards (DRENAR) -- spec plano-ssot-e-cards-v2-part-9.
  O lote e injetado por `python tools/fsrs_queue.py --build-player` dentro do
  script de id "lote" (type application/json) que fica no fim do body.
  O marcador de abertura tem de ser UNICO no arquivo -- nao repetir a tag aqui.

  REGUA v2 (R2/F112, 18/09/2026): a nota mede ESFORCO DE RECUPERACAO, nao
  completude -- 1 falhou / 2 com esforco / 3 lembrou / 4 sem esforco. Portador
  unico da regua: app/utils/regua.py.

  FRONTEIRA DURA: esta pagina NUNCA grava FSRS. Ela guarda a primeira nota de
  cada card na capability `db` (colecao sessoes/<sessao>/notas) e o agente
  grava em lote por `--record-lote`, que chama `record_review` -- o caminho de
  escrita unico (Invariante C do revisao-calibrada-contract).

  FONTE UNICA DO PLAYER (s192, spec medhub-hub-v0-part-1): o MedHub HUB
  (core/templates/hub.html) compoe o player a partir de TRES regioes deste
  arquivo, delimitadas por marcadores @player:<regiao>:inicio/fim (css, corpo,
  js), cada um exatamente 1x. Nao copiar o player para o hub: editar aqui.
  O teclado so age com a aba Cards ativa (atributo data-aba do elemento raiz);
  sem o atributo -- este standalone -- age sempre, como antes.
-->
<style>
/* @player:css:inicio */
/* Cores, tipo, espaco e raio vem de core/templates/tema.css (fonte unica; o hub o injeta depois desta regiao
   e o --build-player o embute no standalone). Aqui so a estrutura e os componentes do player (docs/UI.md). */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--papel);
  color:var(--tinta);
  font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:clamp(15px,.95rem + .2vw,17px);
  line-height:1.55;
  overflow-wrap:break-word;
}
.wrap{max-width:var(--wrap);margin:0 auto;padding:22px 16px 72px}
h1{font-size:var(--fs-pagina);font-weight:700;line-height:1.2;margin:0;letter-spacing:-.02em}
h2{margin:0}
p{margin:0}
kbd{
  font-size:.78em;background:var(--afundado);border:1px solid var(--linha);
  border-bottom-width:2px;border-radius:var(--raio-p);padding:1px 6px;color:var(--tinta2);
}
.topo{display:flex;flex-wrap:wrap;gap:var(--esp-3);align-items:baseline;justify-content:space-between}
.sub{color:var(--tinta3);font-size:var(--fs-legenda);margin-top:2px}
.metros{display:flex;flex-wrap:wrap;gap:var(--esp-2) var(--esp-4);align-items:center}
.metro{color:var(--tinta3);font-size:var(--fs-legenda)}
.metro b{color:var(--tinta);font-size:1.05em;font-weight:650}
/* s226 (part-2): no hub, o contador do Painel ("N de T hoje") e o numero; a fila do lote vem menor */
.metro.dia b{font-size:1.3em;font-weight:700}
.com-dia .metro.fila{font-size:var(--fs-meta)}
.com-dia .metro.fila b{font-size:1em;font-weight:600;color:var(--tinta2)}
.barra{height:6px;background:var(--trilho);border-radius:var(--raio-pilula);margin:var(--esp-4) 0 var(--esp-2);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--acento);border-radius:inherit;transition:width var(--transicao)}
.tally{display:flex;flex-wrap:wrap;gap:var(--esp-2) var(--esp-4);color:var(--tinta3);font-size:var(--fs-meta);margin-bottom:var(--esp-4)}
/* s229 (pedido dele, 15/10): os tres controles do card no bloco de cima, numa linha (`.topo-acoes`): Virar em
   ciano (o primario, .primario), Pausar em ambar, Defeito do card em rosa (a marca); as opcoes do defeito abrem
   logo abaixo, dentro da placa do topo. O dado gravado (defeito + motivo) nao mudou.
   ⚰️ *s228: o Pausar morava nos contadores e o Defeito a direita do tally; o Virar, sob o card.* */
.topo-acoes{margin-top:0}
.topo-acoes kbd{margin-left:var(--esp-1)}
#btn-defeito{border-color:var(--rosa);color:var(--rosa)}
#btn-defeito:hover,#btn-defeito[aria-expanded="true"]{background:var(--rosa-fraco);border-color:var(--rosa);color:var(--tinta)}
.tally b{color:var(--tinta2)}
/* s227 (tema v4 part 3): duas placas -- o topo (contadores, barra, tally) e, logo abaixo, o card ELEVADO (a
   superficie --afundado, um degrau acima da placa): pergunta > resposta > auxiliares (regra, armadilha, assunto).
   Os botoes ficam fora da placa do card. A .placa vem do tema.css; aqui so a composicao */
.cards-topo{margin-bottom:var(--esp-4)}
#drill{margin-top:var(--esp-4)}
/* s228 (pedido dele: "ainda seguem muito chapados no fundo"): o card e a camada ELEVADA (--afundado) com a borda de
   controle (e objeto de toque: tocar vira); a frente centra a pergunta; o verso abre como o degrau de baixo da mesma
   placa (--card, de borda a borda, nunca caixa dentro do card) */
.card{min-height:220px;display:flex;flex-direction:column}
.card.placa{background:var(--afundado);border-color:var(--linha-forte)}
.card.frente{cursor:pointer}
.card.frente:hover{border-color:var(--acento)}
.card:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--acento);outline-offset:3px}
.reason{align-self:flex-start;font-size:var(--fs-meta);font-weight:600;color:var(--tinta2);background:var(--card);border-radius:var(--raio-pilula);padding:1px var(--esp-2);margin-bottom:var(--esp-3)}
.contexto{color:var(--tinta2);font-size:.95em;margin-bottom:var(--esp-3);padding-left:var(--esp-3);border-left:2px solid var(--linha-forte)}
.pergunta{font-size:clamp(1.2rem,1.05rem + .6vw,1.5rem);line-height:1.3;font-weight:700;letter-spacing:-.01em;color:var(--tinta);text-wrap:pretty}
.card:not(.frente){padding-bottom:0}
.verso{margin:var(--esp-5) calc(-1 * var(--esp-4)) 0;padding:var(--esp-4);background:var(--card);
       border-top:1px solid var(--borda-placa);border-radius:0 0 calc(var(--raio-placa) - 1px) calc(var(--raio-placa) - 1px);display:grid;gap:var(--esp-4)}
@media (min-width:521px){.verso{margin:var(--esp-5) calc(-1 * var(--esp-5)) 0;padding:var(--esp-5)}}
.rot{font-size:var(--fs-meta);font-weight:650;color:var(--tinta3);margin-bottom:var(--esp-1)}
.resposta{font-size:1.125rem;line-height:1.45;font-weight:600;color:var(--tinta)}
/* regra-mestre e armadilha: secoes do mesmo card (filete a esquerda), nao caixas dentro da caixa */
.bloco{padding:0 0 0 var(--esp-3);border-left:2px solid var(--linha-forte);color:var(--tinta2)}
.bloco .rot{color:var(--tinta2)}
.bloco.alerta{border-left-color:var(--aviso)}
.bloco.alerta .rot{color:var(--aviso)}
.taxonomia{color:var(--tinta3);font-size:var(--fs-meta)}
.acoes{display:flex;flex-wrap:wrap;gap:var(--esp-2);margin-top:var(--esp-4)}
button{
  font:inherit;cursor:pointer;border-radius:var(--raio);border:1px solid var(--linha-forte);
  background:transparent;color:var(--tinta);padding:10px 16px;min-height:44px;
  transition:transform var(--transicao),background var(--transicao),border-color var(--transicao);
}
button:hover{background:var(--afundado)}
button:active{transform:translateY(1px)}
button[disabled]{opacity:.45;cursor:not-allowed}
.primario{background:var(--acento);border-color:var(--acento);color:var(--sobre);font-weight:650}
.primario:hover{background:var(--acento);filter:brightness(1.08)}
.fantasma{background:transparent;border-style:dashed;color:var(--tinta2);font-size:var(--fs-legenda)}
/* as 4 notas: numero + rotulo (nunca so a cor); a cor segue o esforco -- 1 erro, 2 aviso, 3 ok, 4 acento */
.notas{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--esp-2);margin-top:var(--esp-4)}
.notas button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:var(--esp-3) var(--esp-4);min-height:64px;border-top-width:3px}
.notas button b{font-size:1.25em;font-weight:700}
.notas button span{font-size:var(--fs-meta);color:var(--tinta3)}
.notas button[data-nota="1"]{border-top-color:var(--erro)} .notas button[data-nota="1"] b{color:var(--erro)}
.notas button[data-nota="2"]{border-top-color:var(--aviso)} .notas button[data-nota="2"] b{color:var(--aviso)}
.notas button[data-nota="3"]{border-top-color:var(--ok)} .notas button[data-nota="3"] b{color:var(--ok)}
.notas button[data-nota="4"]{border-top-color:var(--acento)} .notas button[data-nota="4"] b{color:var(--acento)}
.dica{color:var(--tinta3);font-size:var(--fs-meta);margin-top:var(--esp-3)}
.aviso{
  border-left:3px solid var(--aviso);background:var(--aviso-fraco);color:var(--tinta);
  padding:var(--esp-3) var(--esp-4);border-radius:var(--raio-p);margin-top:var(--esp-4);font-size:var(--fs-legenda);
}
/* s195: banco fora = aviso que se ve no celular, no primeiro card */
.aviso.forte{border:2px solid var(--aviso);border-left-width:6px;font-size:1em;font-weight:650;line-height:1.4}
.linha-defeito{display:flex;flex-wrap:wrap;gap:var(--esp-2);margin-top:var(--esp-3)}
.linha-defeito input{
  flex:1 1 220px;font:inherit;padding:10px 12px;border-radius:var(--raio);min-height:44px;
  border:1px solid var(--linha-forte);background:var(--papel);color:var(--tinta);
}
.defeito-opcoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--esp-2);margin-top:var(--esp-3)}
.defeito-opcoes button{min-height:44px;font-size:var(--fs-legenda);text-align:left}
/* tela de fim (s194): desempenho + agenda dos proximos 7 dias -- s227: uma placa (as linhas com filete por dentro) */
.painel-fim{margin-top:var(--esp-5)}
.painel-fim h2{font-size:var(--fs-secao);font-weight:700;margin-bottom:var(--esp-1)}
pre{
  background:var(--afundado);border:1px solid var(--linha);border-radius:var(--raio);
  padding:var(--esp-3);overflow:auto;font-size:.78em;line-height:1.45;margin:var(--esp-3) 0 0;
}
.pausa{border-color:var(--aviso);color:var(--aviso)}
.pausa:hover,.pausa[aria-pressed="true"]{background:var(--aviso-fraco);border-color:var(--aviso);color:var(--tinta)}
/* metricas do fim: UMA faixa entre dois filetes, nao tres caixas */
.fim-grade{display:flex;flex-wrap:wrap;gap:var(--esp-3) var(--esp-6);margin-top:var(--esp-4);padding:var(--esp-3) 0;border-block:1px solid var(--linha)}
.fim-grade > div{min-width:0}
.fim-num{font-size:1.375rem;font-weight:700;line-height:1.2;color:var(--tinta)}
.fim-rot{color:var(--tinta3);font-size:var(--fs-meta)}
.fim-secao{margin:var(--esp-5) 0 var(--esp-2)}
.dist{display:grid;gap:var(--esp-2)}
.dist-linha{display:grid;grid-template-columns:minmax(0,7.5rem) minmax(0,1fr) 2.2rem;gap:var(--esp-3);align-items:center;font-size:var(--fs-legenda)}
.dist-rot{min-width:0;color:var(--tinta2)}
.dist-barra{height:8px;background:var(--trilho);border-radius:var(--raio-pilula);overflow:hidden}
.dist-barra i{display:block;height:100%;background:var(--acento);border-radius:inherit}
.dist-barra i.fraca{background:var(--aviso)}
.dist-n{text-align:right;font-weight:650}
.temas{display:flex;flex-wrap:wrap;gap:var(--esp-2);list-style:none;margin:0;padding:0}
.temas li{min-width:0;background:var(--afundado);color:var(--tinta2);border-radius:var(--raio-pilula);padding:2px 10px;font-size:var(--fs-meta)}
.agenda{margin:0}
.agenda svg{display:block;width:min(100%,34rem);height:auto;overflow:visible}
.ag-base{fill:var(--linha-forte)}
.ag-lote{fill:var(--acento)}
.ag-eixo{stroke:var(--linha);stroke-width:1}
.ag-val{fill:var(--tinta);font-size:14px;font-weight:650}
.ag-dia{fill:var(--tinta3);font-size:13px}
.legenda{display:flex;flex-wrap:wrap;gap:var(--esp-1) var(--esp-4);color:var(--tinta3);font-size:var(--fs-meta);margin-top:var(--esp-2)}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legenda .lg-lote{background:var(--acento)}
.legenda .lg-base{background:var(--linha-forte)}
.bruto{margin-top:var(--esp-5);border-top:1px solid var(--linha);padding-top:var(--esp-3)}
.bruto summary{cursor:pointer;color:var(--tinta3);font-size:var(--fs-legenda);min-height:44px;display:flex;align-items:center}
[hidden]{display:none !important}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}
/* @player:css:fim */
</style>
</head>
<body>
<div class="wrap">
<!-- @player:corpo:inicio -->
  <!-- s227 (tema v4 part 3): o topo e UMA placa (titulo, contadores, relogio, pausa, barra, tally) -->
  <div class="placa cards-topo">
    <header class="topo">
      <div>
        <h1>Cards de hoje</h1>
        <span id="sessao" hidden></span>
      </div>
      <div class="metros">
        <span class="metro dia" id="dia-contador" hidden><b id="dia-n">0</b> de <span id="dia-t">0</span> hoje</span>
        <span class="metro" id="metro-lote"><b id="feitos">0</b>/<span id="total">0</span> feitos</span>
        <span class="metro fila">fila <b id="pendentes">0</b></span>
        <span class="metro" title="Tempo ativo: so conta com o card na tela"><b id="relogio">00:00</b></span>
      </div>
    </header>
    <div class="barra"><i id="progresso"></i></div>
    <p class="tally" id="tally"></p>
    <!-- s229 (pedido dele, 15/10): os TRES controles do card no bloco de cima, numa linha -- Virar (ciano, o
         primario), Pausar (ambar) e Defeito do card (rosa); as opcoes do defeito abrem logo abaixo -->
    <div class="acoes topo-acoes">
      <button id="btn-virar" class="primario">Virar o card <kbd>Espaco</kbd></button>
      <button type="button" id="btn-pausa" class="pausa" aria-pressed="false">Pausar <kbd>P</kbd></button>
      <button type="button" id="btn-defeito" class="defeito" aria-expanded="false" aria-controls="defeito-opcoes">Defeito do card <kbd>D</kbd></button>
    </div>
    <div class="defeito-opcoes" id="defeito-opcoes" hidden>
      <button type="button" class="fantasma" data-motivo="Card longo">Card longo</button>
      <button type="button" class="fantasma" data-motivo="Pergunta composta">Pergunta composta</button>
      <button type="button" class="fantasma" data-motivo="Pergunta circular">Pergunta circular</button>
      <button type="button" class="fantasma" data-motivo="Contexto cortado">Contexto cortado</button>
      <button type="button" class="fantasma" data-motivo="Erro de portugues">Erro de portugues</button>
      <button type="button" class="fantasma" id="btn-defeito-outro">Outro...</button>
      <button type="button" id="btn-cancelar">Cancelar</button>
    </div>

    <form class="linha-defeito" id="form-defeito" hidden>
      <input id="motivo" type="text" maxlength="120" placeholder="Motivo curto do defeito" aria-label="Motivo do defeito">
      <button type="submit">Marcar e pular</button>
      <button type="button" id="btn-cancelar-outro">Cancelar</button>
    </form>
  </div>

  <div id="aviso" class="aviso" hidden></div>
  <div id="aviso-momento" class="aviso" role="status" hidden></div>
  <div id="aviso-fila" class="aviso" role="status" hidden></div>

  <main id="drill">
    <article class="card placa" id="card" tabindex="0" aria-live="polite">
      <p class="reason" id="reason" hidden></p>
      <p class="contexto" id="contexto" hidden></p>
      <h2 class="pergunta" id="pergunta">Carregando os cards...</h2>
      <div class="verso" id="verso" hidden>
        <div><p class="rot">Resposta</p><p class="resposta" id="resposta"></p></div>
        <div class="bloco" id="bloco-regra" hidden><p class="rot">Regra-mestre</p><p id="regra"></p></div>
        <div class="bloco alerta" id="bloco-armadilha" hidden><p class="rot">Armadilha</p><p id="armadilha"></p></div>
        <p class="taxonomia" id="taxonomia"></p>
      </div>
    </article>

    <div class="notas" id="notas-botoes" hidden>
      <button data-nota="1"><b>1</b><span>falhei</span></button>
      <button data-nota="2"><b>2</b><span>com esforco</span></button>
      <button data-nota="3"><b>3</b><span>lembrei</span></button>
      <button data-nota="4"><b>4</b><span>sem esforco</span></button>
    </div>

  </main>

  <section class="painel-fim placa" id="fim" hidden>
    <h2 id="fim-titulo">Lote concluido</h2>
    <p class="sub" id="fim-sub"></p>
    <p class="dica" id="fim-origem"></p>
    <div id="fim-resumo" hidden>
      <div class="fim-grade">
        <div><p class="fim-num" id="fim-pct">-</p><p class="fim-rot">com nota 3 ou 4</p></div>
        <div><p class="fim-num" id="fim-tempo">-</p><p class="fim-rot">tempo ativo</p></div>
        <div><p class="fim-num" id="fim-medio">-</p><p class="fim-rot">media por card</p></div>
      </div>
      <p class="rot fim-secao">Notas</p>
      <div class="dist" id="fim-dist"></div>
      <div id="fim-temas-bloco" hidden>
        <p class="rot fim-secao">Temas para rever (nota 1 ou 2)</p>
        <ul class="temas" id="fim-temas"></ul>
      </div>
      <figure class="agenda" id="fim-agenda" hidden>
        <figcaption class="rot fim-secao">Cards previstos nos proximos 7 dias</figcaption>
        <div id="fim-agenda-grafico"></div>
        <p class="legenda"><span><i class="lg-lote"></i>deste lote</span><span><i class="lg-base"></i>demais cards</span></p>
        <p class="dica" id="fim-agenda-nota" hidden></p>
      </figure>
    </div>
    <details class="bruto" id="fim-bruto">
      <summary>Dados brutos</summary>
      <pre id="json-notas"></pre>
      <div class="acoes"><button id="btn-copiar">Copiar os dados</button></div>
    </details>
  </section>

<!-- @player:corpo:fim -->
</div>

<script id="lote" type="application/json">{"sessao":"exemplo","gerado_em":"","total":0,"cards":[]}</script>
<!-- @player:js:inicio -->
<script>
(function(){
  "use strict";

  var LOTE = {sessao:"exemplo", gerado_em:"", total:0, cards:[]};
  try{
    LOTE = JSON.parse(document.getElementById("lote").textContent) || LOTE;
  }catch(e){
    LOTE = {sessao:"erro", gerado_em:"", total:0, cards:[]};
  }
  var CARDS = Array.isArray(LOTE.cards) ? LOTE.cards : [];

  var $ = function(id){ return document.getElementById(id); };
  var notas = new Map();      // card_id -> {card_id, rating_primeira, ts, defeito, motivo}
  var fila = [];              // cards pendentes, na ordem de apresentacao
  var virado = false;
  var colecao = null;         // ref da colecao sessoes/<sessao>/notas
  var dbOk = false;
  var dbDeclarado = false;    // ja avisamos que o db esta fora?
  var interagiu = false;      // trava o remount tardio depois do 1o gesto

  var ROTULO = {
    vencido:"revisao vencida", fresh_error:"erro recente",
    agendado:"agendado p/ hoje", novo:"novo", pre_bloco:"antes do bloco"
  };
  var NOME_NOTA = {1:"falhei", 2:"com esforco", 3:"lembrei", 4:"sem esforco"};

  // ------------------------------------------------------------ tempo ativo
  // s194: o relogio era de PAREDE (inicio = menor ts das notas salvas) e marcou
  // 1071 min num drill feito em duas janelas com uma noite no meio. Agora so
  // conta tempo ATIVO: card na tela, aba visivel, sem pausa, e no maximo
  // TETO_OCIOSO_MS depois do ultimo gesto (tecla, toque, card novo). O acumulado
  // mora no localStorage por sessao; storage indisponivel = recomeca do zero.
  var TETO_OCIOSO_MS = 3 * 60 * 1000;
  var CHAVE_TEMPO = "medhub.tempo." + (LOTE.sessao || "-");

  // ------------------------------------------------------- espelho local
  // s195: 90 notas dadas no celular sumiram num reload porque o `db` nao subiu
  // e a pagina so avisou em letra miuda. Agora cada nota vai ANTES ao
  // localStorage (por sessao) e volta dali no reload; quando o db abre, o que
  // ele nao tem e reenviado. Storage indisponivel = so o db, como antes.
  var CHAVE_NOTAS = "medhub.notas." + (LOTE.sessao || "-");
  var espelhoOk = true;

  function lerNotasLocais(){
    try{
      var lista = JSON.parse(localStorage.getItem(CHAVE_NOTAS) || "[]");
      return Array.isArray(lista) ? lista : [];
    }catch(e){ return []; }
  }

  function espelharNotas(){
    try{
      var lista = [];
      notas.forEach(function(n){ lista.push(n); });
      localStorage.setItem(CHAVE_NOTAS, JSON.stringify(lista));
      espelhoOk = true;
    }catch(e){ espelhoOk = false; }
    return espelhoOk;
  }

  function lerTempo(){
    try{
      var v = parseInt(localStorage.getItem(CHAVE_TEMPO), 10);
      return isFinite(v) && v > 0 ? v : 0;
    }catch(e){ return 0; }
  }

  var tempo = {ativoMs: lerTempo(), pausado: false, ultimoGesto: Date.now(),
               ultimoTique: Date.now(), gravadoMs: -1};

  function gravarTempo(){
    var ms = Math.round(tempo.ativoMs);
    if(ms === tempo.gravadoMs){ return; }
    try{
      localStorage.setItem(CHAVE_TEMPO, String(ms));
      tempo.gravadoMs = ms;
    }catch(e){}
  }

  function cardNaTela(){
    return fila.length > 0 && !$("drill").hidden && !document.hidden && abaDoPlayerAtiva();
  }

  function acumular(){
    var agora = Date.now();
    if(!tempo.pausado && cardNaTela()){
      var fim = Math.min(agora, tempo.ultimoGesto + TETO_OCIOSO_MS);
      if(fim > tempo.ultimoTique){ tempo.ativoMs += fim - tempo.ultimoTique; }
    }
    tempo.ultimoTique = agora;
  }

  function gesto(){
    acumular();
    tempo.ultimoGesto = Date.now();
  }

  function doisDigitos(n){ return (n < 10 ? "0" : "") + n; }

  function relogioTexto(ms){
    var seg = Math.floor(ms / 1000);
    return doisDigitos(Math.floor(seg / 60)) + ":" + doisDigitos(seg % 60);
  }

  function duracao(ms){
    var s = Math.round(ms / 1000);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return h ? h + "h" + doisDigitos(m) : m + ":" + doisDigitos(s % 60);
  }

  function tique(){
    acumular();
    $("relogio").textContent = relogioTexto(tempo.ativoMs);
    gravarTempo();
  }

  function alternarPausa(){
    gesto();
    tempo.pausado = !tempo.pausado;
    var b = $("btn-pausa");
    b.setAttribute("aria-pressed", tempo.pausado ? "true" : "false");
    b.innerHTML = (tempo.pausado ? "Retomar" : "Pausar") + " <kbd>P</kbd>";
    tique();
  }

  // ---------------------------------------------------------------- avisos
  // Dois tipos (s194): o PERSISTENTE (#aviso) diz algo que continua verdade --
  // as notas nao estao sendo salvas; o MOMENTANEO (#aviso-momento) corrige um
  // gesto e some ao virar ou ao trocar de card.
  function avisar(texto){
    var el = $("aviso");
    el.textContent = texto;
    el.hidden = false;
  }

  function avisarMomento(texto){
    var el = $("aviso-momento");
    el.textContent = texto;
    el.hidden = false;
  }

  function esconderMomento(){
    $("aviso-momento").hidden = true;
  }

  function textoOrigemSemBanco(){
    return espelhoOk
      ? "As notas estao guardadas neste aparelho e serao enviadas quando esta pagina abrir com conexao. Os dados brutos abaixo sao a copia de seguranca."
      : "Nada foi salvo fora desta tela: abra os dados brutos abaixo, copie e cole no chat.";
  }

  function mostrarDadosBrutos(titulo){
    $("fim").hidden = false;
    $("fim-titulo").textContent = titulo;
    $("fim-origem").textContent = textoOrigemSemBanco();
    $("fim-bruto").open = true;
    renderFallback();
  }

  // O aviso e FORTE de proposito (s195): quem drilla no celular precisa ver, no
  // primeiro card, que a nota nao esta chegando ao banco.
  function declararSemArmazenamento(){
    dbOk = false;
    if(dbDeclarado){ return; }
    dbDeclarado = true;
    espelharNotas();
    $("aviso").classList.add("forte");
    avisar(espelhoOk
      ? "SEM CONEXAO COM O BANCO. As notas ficam guardadas SO neste aparelho ate a pagina abrir com conexao. Pode continuar; nao limpe os dados do navegador e nao troque de aparelho no meio do lote."
      : "SEM CONEXAO COM O BANCO E SEM ARMAZENAMENTO LOCAL. As notas so existem nesta tela: no fim, copie os dados brutos e cole no chat antes de fechar ou recarregar.");
    mostrarDadosBrutos("Notas desta sessao");
  }

  // ------------------------------------------------------------- persistir
  function pacoteNotas(){
    var lista = [];
    notas.forEach(function(n){ lista.push(n); });
    lista.sort(function(a,b){ return a.card_id - b.card_id; });
    return {sessao: LOTE.sessao, gerado_em: LOTE.gerado_em, notas: lista};
  }

  function renderFallback(){
    $("json-notas").textContent = JSON.stringify(pacoteNotas(), null, 1);
  }

  // A falha de gravacao e PASSAGEIRA (s203: "unavailable" em 27/09 desligava o banco pelo resto do
  // lote): com a colecao aberta, toda nota volta a tentar; aceita depois de uma falha, o que so o
  // aparelho tinha vai junto e o aviso forte sai.
  function bancoVoltou(){
    return colecao.get().then(function(snap){
      return reenviarPendentes(snap.docs || []);
    }).then(function(n){
      dbOk = true;
      dbDeclarado = false;
      $("aviso").hidden = true;
      $("aviso").classList.remove("forte");
      if(!$("drill").hidden){ $("fim").hidden = true; }
      if(n){ avisarMomento(n + " nota(s) guardada(s) neste aparelho foram enviadas ao banco."); }
    });
  }

  function salvar(registro){
    atualizarPainel();
    renderFallback();
    espelharNotas();                       // primeiro o aparelho, depois o banco
    if(!colecao){
      declararSemArmazenamento();
      return Promise.resolve();
    }
    return colecao.doc(String(registro.card_id)).set(registro).then(function(){
      if(!dbOk){ return bancoVoltou(); }
    }).catch(function(err){
      dbDeclarado = false;                 // a falha no meio do lote tambem fala alto
      declararSemArmazenamento();
      avisar($("aviso").textContent + " (falha ao salvar: " + ((err && err.code) || "erro") + ")");
    });
  }

  // ---------------------------------------------------------------- painel
  function atualizarPainel(){
    var t = {1:0,2:0,3:0,4:0,defeito:0};
    var feitos = 0;
    notas.forEach(function(n){
      if(n.defeito){ t.defeito += 1; }
      if(n.rating_primeira){ t[n.rating_primeira] += 1; }
      feitos += 1;
    });
    $("feitos").textContent = String(feitos);
    $("total").textContent = String(CARDS.length);
    $("pendentes").textContent = String(fila.length);
    var pct = CARDS.length ? Math.round(100 * feitos / CARDS.length) : 0;
    $("progresso").style.width = pct + "%";
    $("tally").innerHTML = "";
    [["1",t[1]],["2",t[2]],["3",t[3]],["4",t[4]],["defeito",t.defeito]].forEach(function(par){
      var s = document.createElement("span");
      s.textContent = par[0] + ": ";
      var b = document.createElement("b");
      b.textContent = String(par[1]);
      s.appendChild(b);
      $("tally").appendChild(s);
    });
  }

  // ----------------------------------------------------------- apresentacao
  function texto(id, valor, container){
    var alvo = $(id);
    alvo.textContent = valor || "";
    if(container){ $(container).hidden = !valor; }
    else { alvo.hidden = !valor; }
  }

  function mostrar(){
    esconderMomento();
    var c = fila[0];
    if(!c){ return encerrar(); }
    gesto();                                 // card novo na tela reabre a janela ativa
    virado = false;
    $("verso").hidden = true;
    $("card").classList.add("frente");
    $("notas-botoes").hidden = true;
    $("btn-virar").hidden = false;
    $("form-defeito").hidden = true;
    $("defeito-opcoes").hidden = true;
    $("btn-defeito").setAttribute("aria-expanded", "false");
    // Contrato de apresentacao: area/tema NUNCA aparecem antes da revelacao.
    texto("reason", ROTULO[c.selection_reason] || c.selection_reason || "");
    texto("contexto", c.frente_contexto);
    $("pergunta").textContent = c.frente_pergunta || "(card sem pergunta)";
    $("resposta").textContent = c.verso_resposta || "";
    texto("regra", c.verso_regra_mestre, "bloco-regra");
    texto("armadilha", c.verso_armadilha, "bloco-armadilha");
    $("taxonomia").textContent = [c.area, c.tema].filter(Boolean).join(" / ");
    $("card").focus();
    atualizarPainel();
  }

  function virar(){
    if(!fila.length || virado){ return; }
    esconderMomento();
    gesto();
    virado = true;
    $("verso").hidden = false;
    $("card").classList.remove("frente");
    $("btn-virar").hidden = true;
    $("notas-botoes").hidden = false;
  }

  // ------------------------------------------------------------ tela de fim
  // A agenda so e verdadeira porque o export embute, por card, o vencimento
  // previsto para cada nota (`previsao`, o mesmo `db.preview_ratings` do
  // --preview) e a carga dos demais cards (`agenda_base`). A pagina so SOMA:
  // nada de FSRS aqui. Lote antigo sem esses campos = so o desempenho.
  // s195: a previsao e calculada no dia do EXPORT. Lote exportado de vespera e
  // drenado no dia seguinte mostrava tudo 1 dia antes ("agendado no mesmo dia da
  // drenagem"). Cada previsao anda os dias entre o export e a nota (so para a
  // frente, ate 14 d); lote sem `gerado_em` ou nota do mesmo dia = como antes.
  function diaLocal(iso){
    if(!iso){ return ""; }
    var s = String(iso);
    var d = new Date(s.length > 10 ? s.replace(" ", "T") : s + "T00:00:00");
    if(isNaN(d.getTime())){ return s.slice(0, 10); }
    return d.getFullYear() + "-" + doisDigitos(d.getMonth() + 1) + "-" + doisDigitos(d.getDate());
  }

  function somarDias(iso, n){
    var p = String(iso).split("-");
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]) + n);
    return d.getFullYear() + "-" + doisDigitos(d.getMonth() + 1) + "-" + doisDigitos(d.getDate());
  }

  function deslocamento(n){
    var exp = diaLocal(LOTE.gerado_em), dia = diaLocal(n.ts);
    if(!exp || !dia){ return 0; }
    var pe = exp.split("-"), pd = dia.split("-");
    var d = Math.round((Date.UTC(+pd[0], pd[1] - 1, +pd[2]) - Date.UTC(+pe[0], pe[1] - 1, +pe[2])) / 86400000);
    return (d > 0 && d <= 14) ? d : 0;
  }

  function agendaPrevista(){
    var ab = LOTE.agenda_base;
    if(!ab || !Array.isArray(ab.dias) || !ab.dias.length){ return null; }
    var dias = ab.dias.map(function(d){
      return {data: String(d.data || ""), base: Math.max(0, Number(d.n) || 0), lote: 0};
    });
    var indice = {};
    dias.forEach(function(d, i){ indice[d.data] = i; });
    var primeiro = dias[0].data, ultimo = dias[dias.length - 1].data;
    var herdados = Math.max(0, Number(ab.vencidos_fora_do_lote) || 0);
    dias[0].base += herdados;                  // vencido que ficou fora do lote cai no 1o dia
    var pendentes = 0, semPrevisao = 0;
    CARDS.forEach(function(c){
      var n = notas.get(c.card_id);
      var alvo;
      if(!n || !n.rating_primeira || n.defeito){
        alvo = primeiro;                       // sem nota gravavel: continua vencido
        pendentes += 1;
      }else{
        var p = c.previsao && c.previsao[String(n.rating_primeira)];
        if(!p){ semPrevisao += 1; return; }
        alvo = somarDias(String(p).slice(0, 10), deslocamento(n));
        if(alvo < primeiro){ alvo = primeiro; } // volta ainda hoje = aparece no 1o dia
      }
      if(alvo > ultimo || !(alvo in indice)){ return; }
      dias[indice[alvo]].lote += 1;
    });
    return {dias: dias, herdados: herdados, pendentes: pendentes, semPrevisao: semPrevisao};
  }

  function resumo(){
    var dist = {1:0, 2:0, 3:0, 4:0}, avaliados = 0, bons = 0, temas = {};
    var porId = {};
    CARDS.forEach(function(c){ porId[c.card_id] = c; });
    notas.forEach(function(n){
      var r = Number(n.rating_primeira);
      if(!(r >= 1 && r <= 4)){ return; }
      dist[r] += 1;
      avaliados += 1;
      if(r >= 3){ bons += 1; return; }
      var c = porId[n.card_id] || {};
      var t = c.tema || c.area || "sem tema";
      temas[t] = (temas[t] || 0) + 1;
    });
    var lista = Object.keys(temas).map(function(k){ return [k, temas[k]]; });
    lista.sort(function(a, b){ return (b[1] - a[1]) || (a[0] < b[0] ? -1 : 1); });
    return {dist: dist, avaliados: avaliados, bons: bons, temas: lista, agenda: agendaPrevista()};
  }

  function esc(v){
    return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  var DIA_SEMANA = ["dom", "seg", "ter", "qua", "qui", "sex", "sab"];
  function rotuloDia(iso){
    var p = String(iso).split("-");
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    if(p.length !== 3 || isNaN(d.getTime())){ return String(iso).slice(5); }
    return DIA_SEMANA[d.getDay()] + " " + p[2];
  }

  function renderAgenda(ag){
    var fig = $("fim-agenda");
    if(!ag){ fig.hidden = true; return; }
    var L = 360, TOPO = 24, BASE = 156, colW = L / ag.dias.length;
    var barW = Math.min(30, colW * 0.6), alt = BASE - TOPO, maior = 1;
    ag.dias.forEach(function(d){ maior = Math.max(maior, d.base + d.lote); });
    var partes = [], falas = [];
    ag.dias.forEach(function(d, i){
      var x = i * colW + (colW - barW) / 2, cx = i * colW + colW / 2;
      var hb = alt * d.base / maior, hl = alt * d.lote / maior;
      var vao = hb > 0 && hl > 0 ? 2 : 0;
      var rot = rotuloDia(d.data), total = d.base + d.lote;
      falas.push(rot + ": " + total);
      var g = '<g data-dia="' + esc(d.data) + '" data-base="' + d.base + '" data-lote="' + d.lote + '">' +
              '<title>' + esc(rot) + ": " + d.lote + " deste lote, " + d.base + " demais</title>";
      if(hb > 0){
        g += '<rect class="ag-base" x="' + x.toFixed(1) + '" y="' + (BASE - hb).toFixed(1) +
             '" width="' + barW.toFixed(1) + '" height="' + hb.toFixed(1) + '" rx="2"/>';
      }
      if(hl > 0){
        g += '<rect class="ag-lote" x="' + x.toFixed(1) + '" y="' + (BASE - hb - vao - hl).toFixed(1) +
             '" width="' + barW.toFixed(1) + '" height="' + hl.toFixed(1) + '" rx="2"/>';
      }
      g += '<text class="ag-val" x="' + cx.toFixed(1) + '" y="' + (BASE - hb - vao - hl - 6).toFixed(1) +
           '" text-anchor="middle">' + total + "</text>" +
           '<text class="ag-dia" x="' + cx.toFixed(1) + '" y="' + (BASE + 18) +
           '" text-anchor="middle">' + esc(rot) + "</text></g>";
      partes.push(g);
    });
    $("fim-agenda-grafico").innerHTML =
      '<svg viewBox="0 0 ' + L + ' 186" role="img" aria-label="' +
      esc("Cards previstos por dia: " + falas.join("; ")) + '">' +
      '<line class="ag-eixo" x1="0" x2="' + L + '" y1="' + BASE + '" y2="' + BASE + '"/>' +
      partes.join("") + "</svg>";
    var nota = [];
    if(ag.herdados){ nota.push("O 1o dia inclui " + ag.herdados + " card(s) vencido(s) que ficaram fora deste lote."); }
    if(ag.pendentes){ nota.push(ag.pendentes + " card(s) deste lote sem nota continuam vencidos e aparecem no 1o dia."); }
    if(ag.semPrevisao){ nota.push(ag.semPrevisao + " card(s) sem previsao ficaram fora do grafico."); }
    $("fim-agenda-nota").textContent = nota.join(" ");
    $("fim-agenda-nota").hidden = !nota.length;
    fig.hidden = false;
  }

  function renderResumo(r){
    $("fim-resumo").hidden = false;
    $("fim-pct").textContent = r.avaliados ? Math.round(100 * r.bons / r.avaliados) + "%" : "-";
    $("fim-tempo").textContent = duracao(tempo.ativoMs);
    var medio = r.avaliados ? tempo.ativoMs / r.avaliados : 0;
    $("fim-medio").textContent = !r.avaliados ? "-"
      : (medio < 60000 ? Math.round(medio / 1000) + " s" : duracao(medio));
    var maior = Math.max(1, r.dist[1], r.dist[2], r.dist[3], r.dist[4]);
    $("fim-dist").innerHTML = [1, 2, 3, 4].map(function(k){
      var n = r.dist[k];
      return '<div class="dist-linha" data-nota="' + k + '" data-n="' + n + '">' +
             '<span class="dist-rot"><b>' + k + "</b> " + NOME_NOTA[k] + "</span>" +
             '<span class="dist-barra"><i' + (k < 3 ? ' class="fraca"' : "") +
             ' style="width:' + Math.round(100 * n / maior) + '%"></i></span>' +
             '<span class="dist-n">' + n + "</span></div>";
    }).join("");
    var ul = $("fim-temas");
    ul.innerHTML = "";
    r.temas.forEach(function(par){
      var li = document.createElement("li");
      li.textContent = par[0] + (par[1] > 1 ? " (" + par[1] + ")" : "");
      ul.appendChild(li);
    });
    $("fim-temas-bloco").hidden = !r.temas.length;
    renderAgenda(r.agenda);
  }

  function encerrar(){
    acumular();
    esconderMomento();
    $("drill").hidden = true;
    $("fim").hidden = false;
    $("fim-titulo").textContent = "Lote concluido";
    var r = resumo();
    $("fim-sub").textContent = r.avaliados + " card(s) com nota em " + duracao(tempo.ativoMs) + " de tempo ativo.";
    if(dbOk){
      $("fim-origem").textContent = "Notas salvas.";
    }else{
      $("fim-origem").textContent = textoOrigemSemBanco();
      $("fim-bruto").open = true;
    }
    renderResumo(r);
    renderFallback();
    atualizarPainel();
    gravarTempo();
  }

  // -------------------------------------------------------------- acoes
  function avaliar(nota){
    if(!fila.length){ return; }
    if(!virado){ avisarMomento("Vire o card antes de dar a nota (Espaco)."); return; }
    gesto();
    var c = fila[0];
    var id = c.card_id;
    interagiu = true;
    if(!notas.has(id)){
      var registro = {card_id:id, rating_primeira:nota, ts:new Date(Date.now()).toISOString()};
      notas.set(id, registro);
      salvar(registro);
    } else if(nota >= 3){
      // s210: redrill resolvido fica REGISTRADO (aparelho e db) para nao voltar a fila numa
      // remontagem; a 1a nota segue a unica que o FSRS grava (`rating_primeira` intocado).
      var ant = notas.get(id);
      if(ant.rating_primeira && ant.rating_primeira < 3 && !ant.redrill_ok && !ant.defeito){
        var feito = mesclar(ant, {card_id:id, ts:ant.ts, redrill_ok:true});
        notas.set(id, feito);
        salvar(feito);
      }
    }
    fila.shift();
    if(nota < 3){ fila.push(c); }   // relearning: volta ao FIM, sem segunda nota gravavel
                                    // R2/F112: era `< 4` sob a regua v1, onde 4 = "cravou".
                                    // Sob a v2, 4 = "sem esforco" (raro) e 3 = lembrou (normal):
                                    // manter `< 4` faria todo acerto comum repetir para sempre.
    mostrar();
  }

  function marcarDefeito(motivo){
    if(!fila.length){ return; }
    var c = fila[0], id = c.card_id;
    interagiu = true;
    var anterior = notas.get(id) || {card_id:id, ts:new Date(Date.now()).toISOString()};
    var registro = {card_id:id, ts:anterior.ts, defeito:true, motivo:motivo};
    if(anterior.rating_primeira){ registro.rating_primeira = anterior.rating_primeira; }
    notas.set(id, registro);
    salvar(registro);
    fila = fila.filter(function(x){ return x.card_id !== id; });
    mostrar();
  }

  function abrirDefeito(){
    if(!fila.length){ return; }
    if(!$("defeito-opcoes").hidden || !$("form-defeito").hidden){ return fecharDefeito(); }   // o mesmo toque fecha
    $("form-defeito").hidden = true;
    $("defeito-opcoes").hidden = false;
    $("btn-defeito").setAttribute("aria-expanded", "true");
  }

  function abrirDefeitoOutro(){
    $("defeito-opcoes").hidden = true;
    $("form-defeito").hidden = false;
    $("motivo").value = "";
    $("motivo").focus();
  }

  function fecharDefeito(){
    $("defeito-opcoes").hidden = true;
    $("form-defeito").hidden = true;
    $("btn-defeito").setAttribute("aria-expanded", "false");
    $("card").focus();
  }

  // -------------------------------------------------------------- teclado
  // No HUB o player divide a pagina com outras abas: Espaco rolaria a aba
  // Aulas e viraria um card invisivel. Sem `data-aba` (standalone), age sempre.
  function abaDoPlayerAtiva(){
    var aba = document.documentElement.getAttribute("data-aba");
    return !aba || aba === "cards";
  }

  document.addEventListener("keydown", function(ev){
    if(!abaDoPlayerAtiva()){ return; }
    gesto();
    if(ev.key === "Escape"){ fecharDefeito(); return; }
    if(ev.target && (ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA")){
      return;
    }
    if(ev.key === " " || ev.code === "Space"){ ev.preventDefault(); virar(); return; }
    if(ev.key >= "1" && ev.key <= "4"){ ev.preventDefault(); avaliar(parseInt(ev.key, 10)); return; }
    if(ev.key === "p" || ev.key === "P"){ ev.preventDefault(); alternarPausa(); return; }
    if(ev.key === "d" || ev.key === "D"){ ev.preventDefault(); abrirDefeito(); }
  });

  // Toque/clique em qualquer lugar conta como gesto (reabre a janela ativa).
  document.addEventListener("pointerdown", gesto);
  // Aba oculta nao conta; ao voltar, a janela recomeca do agora (nunca soma o
  // tempo em que a pagina ficou escondida, mesmo com o timer estrangulado).
  document.addEventListener("visibilitychange", function(){
    tempo.ultimoTique = Date.now();
    if(!document.hidden){ tempo.ultimoGesto = Date.now(); }
    gravarTempo();
    if(!document.hidden){ ressincronizar(); }
  });
  window.addEventListener("pagehide", function(){ acumular(); gravarTempo(); espelharNotas(); });
  window.addEventListener("pageshow", function(ev){ if(ev && ev.persisted){ ressincronizar(); } });

  $("btn-pausa").addEventListener("click", alternarPausa);
  $("btn-virar").addEventListener("click", virar);
  // s228 (pedido dele): tocar no card vira (o mesmo virar() do botao e do Espaco); selecao de texto nao vira
  $("card").addEventListener("click", function(){
    var sel = window.getSelection ? window.getSelection() : null;
    if(sel && !sel.isCollapsed && String(sel)){ return; }
    virar();
  });
  $("btn-defeito").addEventListener("click", abrirDefeito);
  $("btn-cancelar").addEventListener("click", fecharDefeito);
  $("btn-cancelar-outro").addEventListener("click", fecharDefeito);
  $("btn-defeito-outro").addEventListener("click", abrirDefeitoOutro);
  $("defeito-opcoes").addEventListener("click", function(ev){
    var m = ev.target && ev.target.getAttribute && ev.target.getAttribute("data-motivo");
    if(!m){ return; }
    $("defeito-opcoes").hidden = true;
    marcarDefeito(m);
  });
  $("form-defeito").addEventListener("submit", function(ev){
    ev.preventDefault();
    var m = ($("motivo").value || "").trim();
    if(!m){ $("motivo").focus(); return; }
    $("form-defeito").hidden = true;
    marcarDefeito(m);
  });
  Array.prototype.forEach.call(document.querySelectorAll("#notas-botoes button"), function(b){
    b.addEventListener("click", function(){ avaliar(parseInt(b.getAttribute("data-nota"), 10)); });
  });
  $("btn-copiar").addEventListener("click", function(){
    var txt = $("json-notas").textContent;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ $("btn-copiar").textContent = "Copiado"; });
    }
  });

  // ---------------------------------------------------------------- boot
  function montarFila(){
    var novos = [], relearning = [];
    CARDS.forEach(function(c){
      var n = notas.get(c.card_id);
      if(!n){ novos.push(c); return; }
      if(n.defeito){ return; }                        // defeito sai do lote
      if(n.rating_primeira >= 3){ return; }           // resolvido (R2: era >= 4 sob a regua v1)
      if(n.redrill_ok){ return; }                     // redrill ja resolvido (s210)
      relearning.push(c);                             // nota < 3 volta ao fim (R2)
    });
    fila = novos.concat(relearning);
  }

  // s210 (01/10, card 714): o registro do db SOBRESCREVIA o do aparelho e um defeito que so o
  // aparelho tinha sumia dos dois. Agora as duas fontes se MESCLAM: a 1a nota (ts mais antigo)
  // fica, e o defeito de qualquer lado vale.
  function mesclar(a, b){
    if(!a){ return b; }
    if(!b){ return a; }
    var r = {card_id: a.card_id};
    var fonte = a.rating_primeira ? a : b;
    if(a.rating_primeira && b.rating_primeira && String(b.ts || "") < String(a.ts || "")){ fonte = b; }
    if(fonte.rating_primeira){ r.rating_primeira = fonte.rating_primeira; }
    r.ts = fonte.ts || a.ts || b.ts;
    if(a.defeito || b.defeito){ r.defeito = true; r.motivo = a.defeito ? a.motivo : b.motivo; }
    if(a.redrill_ok || b.redrill_ok){ r.redrill_ok = true; }
    return r;
  }

  function absorver(dado){
    if(!dado || typeof dado.card_id === "undefined"){ return; }
    var id = Number(dado.card_id);
    var novo = {card_id: id, ts: dado.ts};
    if(dado.rating_primeira){ novo.rating_primeira = dado.rating_primeira; }
    if(dado.defeito){ novo.defeito = true; novo.motivo = dado.motivo; }
    if(dado.redrill_ok){ novo.redrill_ok = true; }
    notas.set(id, mesclar(notas.get(id), novo));
  }

  function restaurar(docs){
    docs.forEach(function(d){ absorver(d.data && d.data()); });
  }

  function restaurarLocal(){
    lerNotasLocais().forEach(absorver);
  }

  // O que este aparelho tem e o banco nao: vai agora, em sequencia. O encadeamento
  // usa so o `then` do que a colecao devolve (sem Promise nova), para que o teste
  // com db falso sincrono enxergue o reenvio. s210: vai tambem o que o db tem A MENOS
  // (defeito ou nota que so o aparelho tem), nao so o card ausente.
  function reenviarPendentes(docs){
    var noDb = {};
    docs.forEach(function(d){
      var dado = d.data && d.data();
      if(dado && typeof dado.card_id !== "undefined"){ noDb[Number(dado.card_id)] = dado; }
    });
    var faltam = [];
    notas.forEach(function(n){
      var d = noDb[n.card_id];
      if(!d || (n.defeito && !d.defeito) || (n.rating_primeira && !d.rating_primeira) ||
         (n.redrill_ok && !d.redrill_ok)){ faltam.push(n); }
    });
    var i = 0;
    function proximo(){
      if(i >= faltam.length){ return faltam.length; }
      var n = faltam[i];
      i += 1;
      return colecao.doc(String(n.card_id)).set(n).then(proximo);
    }
    return proximo();
  }

  // s210 (01/10, "volta no tempo"): o db que chegava DEPOIS da 1a nota nao remontava a fila
  // (`interagiu`) e os cards ja feitos voltavam. Agora a fila e remontada sempre que o estado
  // muda; o card que esta na tela fica na frente se ainda estiver pendente (nada embaralha
  // no meio da resposta), e so e trocado se ja foi resolvido.
  function remontar(){
    var atual = fila[0];
    montarFila();
    var i = atual ? fila.indexOf(atual) : -1;
    if(i >= 0){
      if(i > 0){ fila.splice(i, 1); fila.unshift(atual); }
      atualizarPainel();
      return;
    }
    mostrar();
  }

  function sincronizarComDb(){
    return colecao.get().then(function(snap){
      var docs = snap.docs || [];
      restaurar(docs);
      espelharNotas();
      atualizarPainel();
      renderFallback();
      remontar();
      return reenviarPendentes(docs);
    }).then(function(n){
      if(n){ avisarMomento(n + " nota(s) guardada(s) neste aparelho foram enviadas ao banco."); }
    });
  }

  // Voltar a aba (ou a pagina restaurada do cache do navegador) relê o aparelho e o banco:
  // o que outra abertura gravou enquanto esta estava escondida sai da fila.
  function ressincronizar(){
    restaurarLocal();
    if(!colecao){ remontar(); return; }
    try{ sincronizarComDb().catch(function(){}); }catch(e){}
  }

  function iniciar(){
    $("sessao").textContent = LOTE.sessao || "-";
    montarFila();
    atualizarPainel();
    tique();
    setInterval(tique, 1000);
    if(!CARDS.length){
      $("pergunta").textContent = "Nenhum card para hoje.";
      $("btn-virar").hidden = true;
      $("btn-defeito").hidden = true;
      return;
    }
    mostrar();
  }

  // A capability chega por promessa; a pagina renderiza SEM ela e acende o
  // armazenamento quando (e se) ele resolver. `use("db")` devolve null quando
  // esta visualizacao nao pode rodar o db -- caso tratado, nunca silencioso.
  restaurarLocal();                        // o reload deste aparelho nao perde nada
  iniciar();
  try{
    window.claude.use("db").then(function(db){
      if(!db){
        declararSemArmazenamento();
        return;
      }
      colecao = db.collection("sessoes/" + LOTE.sessao + "/notas");
      dbOk = true;
      return sincronizarComDb();
    }).catch(function(){
      declararSemArmazenamento();
    });
  }catch(e){
    declararSemArmazenamento();
  }
})();
</script>
<!-- @player:js:fim -->
